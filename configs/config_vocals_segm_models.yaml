# Inference-only checkpoint preset. Model weights and structure are unchanged.

audio:
  chunk_size: 261632
  dim_f: 4096
  hop_length: 512
  n_fft: 8192
  num_channels: 2
  sample_rate: 44100

model:
  encoder_name: tu-maxvit_large_tf_512 # look here for possibilities: https://github.com/qubvel/segmentation_models.pytorch#encoders-
  decoder_type: unet
  act: gelu
  num_channels: 128
  num_subbands: 8

training:
  instruments:
  - vocals
  - other
  target_instrument: null
  use_amp: true # enable or disable usage of mixed precision (float16) - usually it must be true

inference:
  batch_size: 1
  num_overlap: 4
