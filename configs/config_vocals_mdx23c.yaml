# Inference-only checkpoint preset. Model weights and structure are unchanged.

audio:
  chunk_size: 261120
  dim_f: 4096
  hop_length: 1024
  n_fft: 8192
  num_channels: 2
  sample_rate: 44100

model:
  act: gelu
  bottleneck_factor: 4
  growth: 128
  norm: InstanceNorm
  num_blocks_per_scale: 2
  num_channels: 128
  num_scales: 5
  num_subbands: 4
  scale:
  - 2
  - 2

training:
  instruments:
  - vocals
  - other
  target_instrument: null
  use_amp: true # enable or disable usage of mixed precision (float16) - usually it must be true

inference:
  batch_size: 1
  num_overlap: 4
