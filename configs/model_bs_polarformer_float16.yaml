    - 24
    - 24
    - 48
    - 48
    - 48
    - 48
    - 48
    - 48
    - 48
    - 48
    - 128
    - 129
  dim_head: 64
  heads: 8
  attn_dropout: 0.0
  ff_dropout: 0.0
  flash_attn: true
  dim_freqs_in: 1025
  stft_n_fft: 2048
  stft_hop_length: 512
  stft_win_length: 2048
  stft_normalized: false
  mask_estimator_depth: 2
  mlp_expansion_factor: 4
  use_pope: true

training:
  instruments:
    - vocals
    - other
  target_instrument: vocals
  use_amp: true

inference:
  chunk_size: 882000
  batch_size: 4
  num_overlap: 2
  normalize: false
