name: Apply vocal inference cleanup
on:
  push:
    branches: [cleanup/vocal-inference-only]
    paths:
      - '.github/workflows/apply-vocal-cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preview cleanup
        run: python .github/vocal_inference_only_cleanup.py --repo .
      - name: Apply supplied cleanup
        run: python .github/vocal_inference_only_cleanup.py --repo . --apply
      - name: Validate Python syntax
        run: python -m compileall -q inference.py models utils tests
      - name: Remove one-shot helpers
        run: |
          rm .github/vocal_inference_only_cleanup.py
          rm .github/workflows/apply-vocal-cleanup.yml
          rmdir .github/workflows .github 2>/dev/null || true
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'refactor: retain vocal models and inference-only APIs'
          git push origin HEAD:cleanup/vocal-inference-only
