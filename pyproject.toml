[project]
name = "music-source-separation-training"
description = "Vocal-only inference with exactly five selected pretrained model presets."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Roman Solovyev (ZFTurbo)" }]
dependencies = [
  "PyYAML",
  "librosa",
  "ml-collections",
  "numpy>=2.0.0",
  "soundfile",
  "torch>=2.6.0",
  "tqdm"
]
dynamic = ["version"]

[project.scripts]
vocal-separate = "inference:main"

[project.urls]
Repository = "https://github.com/hanruijiang/Music-Source-Separation-Training"
Upstream = "https://github.com/ZFTurbo/Music-Source-Separation-Training"

[project.optional-dependencies]
test = ["pytest", "tomli; python_version < '3.11'"]
spectrogram = ["matplotlib"]
mdx23c = []
segm_models = ["segmentation-models-pytorch", "timm"]
bs_roformer = ["beartype", "einops", "packaging", "rotary-embedding-torch"]
mel_band_roformer = ["beartype", "einops", "packaging", "rotary-embedding-torch"]
bs_polarformer = ["beartype", "einops", "packaging", "rotary-embedding-torch", "PoPE-pytorch"]

[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true
py-modules = ["inference"]

[tool.setuptools.packages.find]
where = ["."]
include = ["models*", "utils*", "configs*"]
namespaces = true

[tool.setuptools.package-data]
configs = ["**/*.yaml"]
